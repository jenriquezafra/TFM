meta:
  seed: 42
  output_dir:
  #TODO: creo que Liu tiene un callback cuando el Brent va mal o algo asi? -> esto debe ser en la creacón de datos synth


data:
  dir: "data/synth/1M_LM"
  shuffle: true
  splits:
    train: 0.8
    val: 0.1
    test: 0.1

optimizer:
  name: "adam"
  learn_rate: 1.0e-3  #NOTE: default for Adam
  weight_decay: 0.0

loss:
  name: "rmse" # mse | rmse | mae | negative log-likelihood loss function (nll) | cross entropy

loop:
  epochs: 1000 # Liu uses 8000
  batch_size: 1024

callbacks:
  early_stopping:
    enabled: True
    monitor: "val_loss"
    patience: 30        # higher if we have noise
    min_delta: 0.0
    warmup_epochs: 50
    mode: "min"

  checkpoint:
    enabled: True
    filename_best: "model_best.pt"
    filename_last: "model_last.pt"


  lr_scheduler:     # StepLR to update lr as the epochs increases
    enabled: True
    name: "step"  
    step_size: 100  # every n epochs to update lr
    gamma: 0.5      # new_lr = old_lr * gamma

outputs:
  loss_curve: True
  gap_curve: True
  lr_curve: True

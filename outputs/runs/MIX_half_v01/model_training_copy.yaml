meta:
  seed: 42
  optimizer: "mix_half" # adam | L-BFGS | mix | mix_half


data:
  dir: "data/synth/1M_Feller"
  shuffle: true
  splits:
    train: 0.8
    val: 0.1
    test: 0.1

preprocessing:
  normalization:
    enabled: false # Liu-style replica: no explicit standardization reported
    normalize_target: false
    eps: 1.0e-12

optimizers:
  - name: "adam"
    learn_rate: 1.0e-3
    weight_decay: 0.0

  - name: "L-BFGS"
    learn_rate: 3.0e-3
    max_iter: 8
    line_search_fn: "strong_wolfe"
    historic_size: 100
    full_batch: true

  - name: "mix"
    step_size: 500
    first_optimizer: "adam"

  - name: "mix_half"
    first_optimizer: "adam" # single switch at half: Adam -> L-BFGS

loss:
  name: "mse" # mse | rmse | mae | negative log-likelihood loss function (nll) | cross entropy

loop:
  epochs: 8000
  batch_size_train: 1024
  batch_size_val: "all"

callbacks:
  early_stopping:   # Liu doesnt use ES
    enabled: False
    monitor: "val_loss"   # val_loss | val_loss_trimmed
    trim_top_fraction: 0.01
    patience: 800
    min_delta: 1.0e-8
    warmup_epochs: 2200
    mode: "min"

  checkpoint:
    enabled: True
    filename_best: "model_best.pt"
    filename_last: "model_last.pt"


  lr_scheduler:     # Liu uses gamma=0.5 every 500 epochs
    enabled: True
    name: "step"  
    step_size: 500  # every n epochs to update lr
    gamma: 0.50      # new_lr = old_lr * gamma

outputs:
  loss_curve: True
  gap_curve: True
  lr_curve: True

evaluation:
  enabled: true
  batch_size: 8192
  bins:
    moneyness: [0.6, 0.8, 0.9, 1.0, 1.1, 1.2, 1.4]
    tau: [0.05, 0.25, 0.5, 1.0, 2.0, 3.0]

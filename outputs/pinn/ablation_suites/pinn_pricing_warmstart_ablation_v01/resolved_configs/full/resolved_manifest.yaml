suite_id: pinn_pricing_warmstart_ablation_v01
seed: 42
baseline_key: warm00_identity
resolved_config_root: outputs/pinn/ablation_suites/pinn_pricing_warmstart_ablation_v01/resolved_configs
base_configs:
  pipeline: configs/pinn_pipeline.yaml
  architecture: configs/pinn_model_architecture.yaml
  training: configs/pinn_training.yaml
  diagnostics: configs/pinn_baseline_diagnostics.yaml
  adaptive: configs/pinn_adaptive_collocation.yaml
diagnostics:
  output_subdir: baseline_diagnostics
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
comparison:
  output_dir: outputs/pinn/ablation_suites/pinn_pricing_warmstart_ablation_v01
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
modes:
  smoke:
    training_overrides:
      sampling:
        sizes:
          n_interior: 512
          n_terminal: 128
          n_lower: 128
      loop:
        epochs: 2
        batch_size_collocation: 128
        batch_size_boundary: 64
        log_every: 1
      optimizers:
      - name: adam
        learn_rate: 0.0001
        weight_decay: 0.0
    diagnostics_overrides:
      diagnostics:
        n_bins: 31
        surface_grid:
          x_points: 31
          y_points: 31
        finite_difference:
          enabled: false
        cf_integration:
          n_u: 240
  full:
    training_overrides:
      meta:
        device: mps
variants:
- key: warm00_identity
  label: Warm-start identity fine-tune
  role: baseline
  metric_focus: pricing
  enabled: true
  description: Fine-tuning corto desde PINN_mix_scaled_param con pesos originales.
  training_overrides:
    meta:
      optimizer: adam
      initial_checkpoint: outputs/pinn/PINN_mix_scaled_param/train/checkpoints/model_best.pt
      initial_checkpoint_strict: true
    loop:
      epochs: 600
      log_every: 50
      val_every: 1
    optimizers:
    - name: adam
      learn_rate: 5.0e-05
      weight_decay: 0.0
    callbacks:
      lr_scheduler:
        enabled: false
    loss:
      weights:
        pde: 1.0
        term: 1.0
        low: 1.0
        no_arbitrage: 1.0

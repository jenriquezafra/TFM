- key: abl01_log_core_pdf
  label: Log core PDF
  enabled: true
  description: 'Ablacion individual fiel al PDF: coordenada x=log(m), PDE en x, features
    sqrt(tau) y q_clip, y Greeks con chain rule.'
  architecture_overrides:
    input:
      features:
      - tau
      - log_moneyness
      - v
      - rho
      - kappa
      - gamma
      - bar_v
      - r
    feature_map:
      enabled: true
      mode: kink_adapted
      input_coordinate: log_moneyness
      moneyness_floor: 1.0e-06
      tau_epsilon: 1.0e-06
      q_epsilon: 1.0e-08
      q_clip: 10.0
  training_overrides:
    sampling:
      coordinate_space: log_moneyness
      domain:
        moneyness:
        - 0.05
        - 2.0
      boundaries:
        lower_moneyness: 0.05
    loss:
      pde:
        coordinate: log_moneyness
      weights:
        pde: 1.0
        term: 5.0
        low: 1.0
        no_arbitrage: 0.0
  diagnostics_overrides:
    global:
      spot_feature: log_moneyness
    diagnostics:
      surface_grid:
        x_feature: moneyness
      boundary_checks:
        lower_moneyness: 0.05
  run_dir: /Users/jenriquezafra/Proyectos/Dev/python/TFM/TFM/outputs/pinn/pinn_greek_ablation_suite_v01/abl01_log_core_pdf

name: PINN_Heston_Price
type: mlp_pinn
input:
  dim: 8
  features:
  - tau
  - moneyness
  - v
  - rho
  - kappa
  - gamma
  - bar_v
  - r
hidden:
  dims:
  - 256
  - 256
  - 256
  - 256
  activation: tanh
  initialization: xavier_uniform
  dropout_rate: 0.0
  batch_norm: false
output:
  dim: 1
  name: price
  activation: linear
physics:
  equation: heston_pde
  requires_autograd: true
  derivative_order: 2
feature_map:
  enabled: true
  mode: log_moneyness
  moneyness_floor: 1.0e-06
  tau_epsilon: 1.0e-06
  q_epsilon: 1.0e-08
  q_clip: 10.0

  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
  thresholds:
    global_improvement:
      global_score_max: 0.95
      price_score_max: 1.1
      hard_score_max: 1.25
      greek_ratio_max: 1.2
    hard_specialist:
      hard_score_max: 0.9
      price_score_max: 1.1
      global_score_max: 1.1

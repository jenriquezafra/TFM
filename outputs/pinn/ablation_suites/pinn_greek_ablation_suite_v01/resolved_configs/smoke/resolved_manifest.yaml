      full_price_guard_ratio_max: 1.1
      neutral_full_price_ratio_max: 1.1
      neutral_hard_price_ratio_max: 1.25
modes:
  smoke:
    training_overrides:
      sampling:
        sizes:
          n_interior: 512
          n_terminal: 128
          n_lower: 128
          n_right: 128
          n_v_zero: 128
        dynamic_collocation:
          start_epoch: 1
          refresh_every: 1
          stop_epoch: 1
          max_refreshes: 1
          n_interior: 512
          n_candidates: 512
          candidate_pool:
            n_candidates: 512
            batch_size: 128
      loop:
        epochs: 2
        mix_half_switch_epoch: 999999
        batch_size_collocation: 128
        batch_size_boundary: 64
        log_every: 1
      optimizers:
      - name: adam
        learn_rate: 0.001
        weight_decay: 0.0
      - name: L-BFGS
        learn_rate: 1.0
        max_iter: 2
        line_search_fn: strong_wolfe
        historic_size: 20
        full_batch: true
    diagnostics_overrides:
      diagnostics:
        n_bins: 31
        surface_grid:
          x_points: 31
          y_points: 31
        finite_difference:
          enabled: false
        cf_integration:
          n_u: 240
    adaptive_overrides:
      adaptive:
        sizes:
          n_interior: 512
        candidate_pool:
          n_candidates: 2000
          batch_size: 512
      training:
        training_config: configs/pinn_training_fixed_theta.yaml
  full:
    diagnostics_overrides:
      diagnostics:
        n_bins: 181
        surface_grid:
          x_points: 181
          y_points: 181
variants:

suite_id: pinn_pricing_nosup_ablation_v01
seed: 42
baseline_key: price00_baseline
resolved_config_root: outputs/pinn/ablation_suites/pinn_pricing_nosup_ablation_v01/resolved_configs
base_configs:
  pipeline: configs/pinn_pipeline_fixed_theta.yaml
  architecture: configs/pinn_model_architecture.yaml
  training: configs/pinn_training_fixed_theta.yaml
  diagnostics: configs/pinn_baseline_diagnostics.yaml
  adaptive: configs/pinn_adaptive_collocation.yaml
diagnostics:
  output_subdir: pricing_diagnostics
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
comparison:
  output_dir: outputs/pinn/ablation_suites/pinn_pricing_nosup_ablation_v01
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
  thresholds:
    pricing_specialist:
      full_price_ratio_max: 0.98
      hard_price_ratio_max: 1.1
      hard_price_specialist_ratio_max: 0.9
      full_price_guard_ratio_max: 1.1
      neutral_full_price_ratio_max: 1.05
      neutral_hard_price_ratio_max: 1.2
modes:
  smoke:
    training_overrides:
      sampling:
        sizes:
          n_interior: 512
          n_terminal: 128
          n_lower: 128
          n_right: 128
          n_v_zero: 128
      loop:
        epochs: 2
        mix_half_switch_epoch: 999999
        batch_size_collocation: 128
        batch_size_boundary: 64
        log_every: 1
      optimizers:
      - name: adam
        learn_rate: 0.001
        weight_decay: 0.0
      - name: L-BFGS
        learn_rate: 1.0
        max_iter: 2
        line_search_fn: strong_wolfe
        historic_size: 20
        full_batch: true
    diagnostics_overrides:
      diagnostics:
        n_bins: 31
        surface_grid:
          x_points: 31
          y_points: 31
        finite_difference:
          enabled: false
        cf_integration:
          n_u: 240
  full:
    training_overrides:
      meta:
        optimizer: adam
      sampling:
        sizes:
          n_interior: 20000
          n_terminal: 5000
          n_lower: 5000
      optimizers:
      - name: adam
        learn_rate: 0.001
        weight_decay: 0.0
      - name: L-BFGS
        learn_rate: 1.0
        max_iter: 30
        line_search_fn: strong_wolfe
        historic_size: 100
        full_batch: true
      loop:
        epochs: 1200
        mix_half_switch_epoch: 999999
        batch_size_collocation: 2048
        batch_size_boundary: 512
        val_every: 25
        log_every: 100
      callbacks:
        lr_scheduler:
          enabled: true
          name: step
          step_size: 300
          gamma: 0.7
    diagnostics_overrides:
      diagnostics:
        n_bins: 181
        surface_grid:
          x_points: 181
          y_points: 181

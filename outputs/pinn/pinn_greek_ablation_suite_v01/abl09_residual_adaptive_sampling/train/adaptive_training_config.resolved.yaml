meta:
  seed: 42
  device: auto
  optimizer: mix_half
  initial_checkpoint: /Users/jenriquezafra/Proyectos/Dev/python/TFM/TFM/outputs/pinn/pinn_greek_ablation_suite_v01/abl08_kink_band_sampling/train/checkpoints/model_best.pt
data:
  supervised_source: cann_quotes_comparison
  target_column: price_market
  val_fraction: 0.2
  input_scaling:
    enabled: true
    method: from_train_summary
    summary_file: /Users/jenriquezafra/Proyectos/Dev/python/TFM/TFM/outputs/pinn/pinn_greek_ablation_suite_v01/abl08_kink_band_sampling/train/metrics/train_summary.yaml
sampling:
  strategy: lhs_static
  mode: fixed_theta
  seed: 42
  output_dir: /Users/jenriquezafra/Proyectos/Dev/python/TFM/TFM/data/synth/pinn_greek_ablation_suite_v01/abl09_residual_adaptive_sampling/full
  sizes:
    n_interior: 40000
    n_terminal: 10000
    n_lower: 10000
    n_right: 10000
    n_v_zero: 10000
  domain:
    tau:
    - 0.0
    - 3.0
    moneyness:
    - 0.05
    - 2.0
    v:
    - 0.01
    - 0.5
    r:
    - 0.0
    - 0.05
  coordinate_space: log_moneyness
  boundaries:
    lower_moneyness: 0.05
    right_moneyness: 3.0
    v_zero_value: 0.0
  kink_band:
    enabled: true
    fraction: 0.3
    c: 2.0
    tau_c: 0.15
    epsilon: 1.0e-08
optimizers:
- name: adam
  learn_rate: 0.001
  weight_decay: 0.0
- name: L-BFGS
  learn_rate: 1.0
  max_iter: 30
  line_search_fn: strong_wolfe
  historic_size: 100
  full_batch: true
loss:
  reduction: mean
  weights:
    pde: 1.0
    term: 5.0
    low: 1.0
    no_arbitrage: 0.05
    pde_bulk: 1.0
    pde_kink: 3.0
    left_delta: 0.25
    left_gamma: 0.05
    right: 1.0
    right_delta: 0.25
    right_gamma: 0.05
    v_zero: 0.5
  pde:
    coordinate: log_moneyness
  no_arbitrage:
    beta_delta: 1.0
    beta_gamma: 1.0
  kink_bulk:
    enabled: true
    c: 2.0
    tau_c: 0.15
    delta_x: 0.05
    delta_tau: 0.02
    ell_epsilon: 1.0e-08
loop:
  epochs: 4000
  mix_half_switch_epoch: 2001
  batch_size_collocation: 2048
  batch_size_boundary: 512
  log_every: 50
callbacks:
  checkpoint:
    enabled: true
    filename_best: model_best.pt
    filename_last: model_last.pt
  early_stopping:
    enabled: false
    monitor: val_total_loss
    patience: 300
    min_delta: 1.0e-07
  lr_scheduler:
    enabled: true
    name: step
    step_size: 500
    gamma: 0.5
evaluation:
  enabled: true
  batch_size: 8192
  metrics:
  - mse
  - mae
  - rmse
  - pde_residual_l2

  derivative_residual_computed: false
greek_definitions:
  delta: dV/dmoneyness; converted to spot S with strike=1.0. For log_moneyness, Delta=e^-x
    U_x / K.
  gamma: d2V/dmoneyness2; converted to spot S with strike=1.0. For log_moneyness,
    Gamma=e^-2x (U_xx-U_x) / K^2.
  vega: dV/dv; current convention is sensitivity to variance v
  theta: calendar-time theta = -dV/dtau
  rho: dV/dr
  multi_output_heads: head_delta/head_gamma/head_vega are reported when the model
    exposes forward_all(); they are diagnostics only and are not COS-trained labels.

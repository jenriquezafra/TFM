meta:
  experiment_id: global_acv_pinn_experimental
  description: 'Experimental global ACV residual PINN with local Black-Scholes put
    control variate, Fourier features on z only, and residual Greek heads in log-moneyness
    coordinates.

    '
outputs:
  root_dir: outputs/pinn
  run_name: global_acv_pinn_experimental_smoke
architecture:
  name: Global_ACV_PINN_Residual_MultiOutput
  type: global_acv_residual_pinn
  input:
    dim: 8
    features:
    - tau
    - log_moneyness
    - v
    - rho
    - kappa
    - gamma
    - bar_v
    - r
  hidden:
    dims:
    - 16
    - 16
    activation: tanh
    initialization: xavier_uniform
    dropout_rate: 0.0
    batch_norm: false
  output:
    dim: 4
    names:
    - residual_price
    - residual_x
    - residual_xx
    - residual_v
    activation: linear
  global_acv:
    enabled: true
    option_type: put
    strike: 1.0
    q_epsilon: 1.0e-08
    bs_epsilon: 1.0e-12
    terminal_tau: 0.0
    z_clip: 50.0
    time_factor: linear_tau
    time_lambda: 1.0
    final_init_scale: 0.0
    fourier:
      frequencies: 2
  physics:
    equation: heston_pde
    coordinate: log_moneyness
    requires_autograd: true
    derivative_order: 2
sampling:
  strategy: global_acv_mixed
  coordinate_space: log_moneyness
  seed: 42
  output_dir: data/synth/global_acv_pinn_smoke
  tau_min: 0.0001
  sizes:
    n_interior: 96
    n_terminal: 32
    n_lower: 32
  mix:
    global: 0.35
    hard_core: 0.2
    z_layer: 0.2
    buffer: 0.25
  hard_region:
    x_abs: 0.03
    tau_max: 0.05
  z_layer:
    z_min: -4.0
    z_max: 4.0
    tau_max: 0.1
  buffer_region:
    x_abs: 0.08
    tau_max: 0.1
  boundaries:
    lower_moneyness: 0.01
  domain:
    tau:
    - 0.0
    - 3.0
    moneyness:
    - 0.01
    - 2.0
    v:
    - 0.01
    - 0.5
    r:
    - 0.0
    - 0.05
    heston_params:
      rho:
      - -0.9
      - 0.0
      kappa:
      - 0.0
      - 3.0
      gamma:
      - 0.01
      - 0.8
      bar_v:
      - 0.01
      - 0.5
training:
  meta:
    seed: 42
    device: cpu
    optimizer: adam
  data:
    supervised_source: none
    target_column: price_market
    val_fraction: 0.25
    input_scaling:
      enabled: true
      method: standardize_train
      eps: 1.0e-08
  optimizers:
  - name: adam
    learn_rate: 5.0e-05
    weight_decay: 0.0
  - name: L-BFGS
    learn_rate: 0.5
    max_iter: 20
    line_search_fn: strong_wolfe
    historic_size: 100
    full_batch: false
    batch_size: 2048
  loss:
    reduction: mean
    pde:
      coordinate: log_moneyness
    weights:
      pde: 1.0
      term: 0.1
      low: 1.0
      no_arbitrage: 0.1
      greek_delta: 0.1
      greek_gamma: 0.01
      greek_vega: 0.1
  loop:
    epochs: 2
    mix_half_switch_epoch: null
    batch_size_collocation: 16
    batch_size_boundary: 16
    log_every: 1
  callbacks:
    checkpoint:
      enabled: true
      filename_best: model_best.pt
      filename_last: model_last.pt
    early_stopping:
      enabled: false
      monitor: val_total_loss
      patience: 150
      min_delta: 1.0e-07
    lr_scheduler:
      enabled: false
      name: step
      step_size: 250
      gamma: 0.5
  evaluation:
    enabled: true
    batch_size: 4096
    metrics:
    - pde_residual_l2
    - greek_head_consistency
anchor_cf:
  enabled: false
  note: Optional sparse CF anchor ablation. Disabled for the label-free base method.

meta:
  seed: 42
  description: 'CaNN calibration (Liu-style): frozen forward NN + Differential Evolution'
model:
  model_dir: latest
  checkpoint: model_best.pt
  device: auto
data:
  market_quotes_path: data/market/market_quotes.csv
  format: auto
  columns:
    moneyness: moneyness
    tau: tau
    r: r
    iv_market: iv_market
    weight: weight
  default_weight: 1.0
calibration:
  parameter_order:
  - rho
  - kappa
  - gamma
  - bar_v
  - v0
  bounds:
    rho:
    - -0.95
    - -0.2
    kappa:
    - 0.3
    - 4.0
    gamma:
    - 0.05
    - 0.9
    bar_v:
    - 0.05
    - 0.6
    v0:
    - 0.05
    - 0.6
  regularization:
    type: l2_squared
    lambda: 0.05
  de:
    maxiter: 500
    popsize: 15
    tol: 0.01
    mutation:
    - 0.5
    - 1.0
    recombination: 0.7
    seed: null
    polish: false
inference:
  batch_size: 4096
synthetic_truth:
  theta_true: null
  truth_file: null
outputs:
  dir: outputs/calibration
  save_residual_heatmap: false
  save_quotes_parquet: true
  save_quotes_csv: false

meta:
  name: heston_synth_smoke_retry
  seed: 42
data:
  n_samples: 300
  batch_size: 1024
  splits:
    train: 0.8
    val: 0.1
    test: 0.1
    stratify:
      enabled: false
      target_column: iv_brent
      n_bins: 20
  heston_params:
    rho:
    - -0.9
    - 0.0
    kappa:
    - 0.0
    - 3.0
    gamma:
    - 0.01
    - 0.8
    bar_v:
    - 0.01
    - 0.5
    v0:
    - 0.05
    - 0.5
    sampling:
      n_params_samples: 5
      method: lhs
  grid:
    moneyness:
    - 0.6
    - 1.4
    tau:
    - 0.05
    - 3.0
    sampling:
      n_params_samples: 100
      method: lhs
market:
  r:
  - 0.0
  - 0.05
  K: 1
  option_type: put
  sampling:
    n_params_samples: 100
    method: lhs
cos_solver:
  N: 1500
  L: 50
  interval_rule: cumulant_autodiff
root_finder:
  method: brent_iv
  methods:
    brent_iv:
      tol: 1.0e-08
      max_iter: 100
      iv_bounds:
      - 1.0e-06
      - 5.0
    LM:
      sigma0: 0.2
quality_check:
  residual_warn_abs: 1.0e-06
  residual_keep_abs: null
  drop_sigma0_hits: false
  keep_all_rows: true
  adaptive_cos_floor_retry:
    enabled: true
    floor_rel_tol: 1.0e-06
    l_multiplier: 1.5
    n_multiplier: 1.0
    max_retries: 1
  force_target_after_filters: true
  generation_chunk_size: 120
  max_generation_rounds: 10
  feller_filter:
    enabled: false
    slack_tol: 0.0
  progress_every: 100
output:
  dtype: float32

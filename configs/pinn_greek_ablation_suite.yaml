suite_id: "pinn_greek_ablation_suite_v01"
seed: 42
baseline_key: "abl00_baseline"
resolved_config_root: "outputs/pinn/ablation_suites/pinn_greek_ablation_suite_v01/resolved_configs"

base_configs:
  pipeline: "configs/pinn_pipeline_fixed_theta.yaml"
  architecture: "configs/pinn_model_architecture.yaml"
  training: "configs/pinn_training_fixed_theta.yaml"
  diagnostics: "configs/pinn_baseline_diagnostics.yaml"
  adaptive: "configs/pinn_adaptive_collocation.yaml"

diagnostics:
  output_subdir: "baseline_diagnostics"
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05

comparison:
  output_dir: "outputs/pinn/ablation_suites/pinn_greek_ablation_suite_v01"
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
  thresholds:
    global_improvement:
      global_score_max: 0.95
      price_score_max: 1.10
      hard_score_max: 1.25
      greek_ratio_max: 1.20
    hard_specialist:
      hard_score_max: 0.90
      price_score_max: 1.10
      global_score_max: 1.10

modes:
  smoke:
    training_overrides:
      sampling:
        sizes:
          n_interior: 512
          n_terminal: 128
          n_lower: 128
          n_right: 128
          n_v_zero: 128
      loop:
        epochs: 2
        mix_half_switch_epoch: 999999
        batch_size_collocation: 128
        batch_size_boundary: 64
        log_every: 1
      optimizers:
        - name: "adam"
          learn_rate: 1.0e-3
          weight_decay: 0.0
        - name: "L-BFGS"
          learn_rate: 1.0
          max_iter: 2
          line_search_fn: "strong_wolfe"
          historic_size: 20
          full_batch: true
    diagnostics_overrides:
      diagnostics:
        n_bins: 31
        surface_grid:
          x_points: 31
          y_points: 31
        finite_difference:
          enabled: false
        cf_integration:
          n_u: 240
    adaptive_overrides:
      adaptive:
        sizes:
          n_interior: 512
        candidate_pool:
          n_candidates: 2000
          batch_size: 512
      training:
        training_config: "configs/pinn_training_fixed_theta.yaml"
  full:
    diagnostics_overrides:
      diagnostics:
        n_bins: 181
        surface_grid:
          x_points: 181
          y_points: 181

variants:
  - key: "abl00_baseline"
    label: "Baseline"
    role: "baseline"
    enabled: true
    description: "PINN actual reentrenada con protocolo comun."

  - key: "abl01_log_core_pdf"
    label: "Log core PDF"
    enabled: true
    description: "Ablacion individual fiel al PDF: coordenada x=log(m), PDE en x, features sqrt(tau) y q_clip, y Greeks con chain rule."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 5.0
          low: 1.0
          no_arbitrage: 0.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl01_log_moneyness_input"
    label: "Log-moneyness input"
    enabled: false
    description: "Desactivada: ablacion legacy incompleta; no representa la propuesta del PDF."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0

  - key: "abl02_log_pde_residual"
    label: "Log PDE residual"
    enabled: false
    description: "Desactivada: requiere dataset en x=log(m) y chain rule coherente; cubierta por abl01_log_core_pdf."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "log_moneyness"
        moneyness_floor: 1.0e-6
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"

  - key: "abl03_log_greek_chain_rule"
    label: "Log Greek chain rule"
    enabled: false
    description: "Desactivada: separaba artificialmente la chain rule de la PDE y las features."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "log_moneyness"
        moneyness_floor: 1.0e-6
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"
    diagnostics_overrides:
      global:
        spot_feature: "moneyness"

  - key: "abl04_kink_adapted_features"
    label: "Kink-adapted features"
    enabled: false
    description: "Desactivada temporalmente: las features adaptadas ya se estudian junto al nucleo log-PDF en abl01_log_core_pdf."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "kink_adapted"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"

  - key: "abl05_guard_boundaries"
    label: "Guard boundaries"
    enabled: false
    description: "Borde izquierdo deep ITM, borde derecho OTM y residual degenerado en v=0."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "kink_adapted"
        moneyness_floor: 1.0e-6
    training_overrides:
      sampling:
        sizes:
          n_right: 10000
          n_v_zero: 10000
        boundaries:
          lower_moneyness: 0.05
          right_moneyness: 3.0
          v_zero_value: 0.0
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 1.0
          low: 1.0
          left_delta: 0.25
          left_gamma: 0.05
          right: 1.0
          right_delta: 0.25
          right_gamma: 0.05
          v_zero: 0.5

  - key: "abl06_no_arbitrage"
    label: "No-arbitrage"
    enabled: false
    description: "Penaliza bounds de precio, rango de Delta y convexidad del put."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "kink_adapted"
        moneyness_floor: 1.0e-6
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"
        no_arbitrage:
          beta_delta: 1.0
          beta_gamma: 1.0
        weights:
          no_arbitrage: 0.05

  - key: "abl07_kink_bulk_loss"
    label: "Kink/bulk PDE loss"
    enabled: false
    description: "Separa el residual PDE en zona kink y zona bulk con un gate suave."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "kink_adapted"
        moneyness_floor: 1.0e-6
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"
        kink_bulk:
          enabled: true
          c: 2.0
          tau_c: 0.15
          delta_x: 0.05
          delta_tau: 0.02
          ell_epsilon: 1.0e-8

  - key: "abl08_kink_band_sampling"
    label: "Kink-band sampling"
    enabled: false
    description: "Reserva una fraccion del interior para la banda |x| <= c sqrt(v tau + eps), tau <= tau_c."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "kink_adapted"
        moneyness_floor: 1.0e-6
    training_overrides:
      sampling:
        kink_band:
          enabled: true
          fraction: 0.30
          c: 2.0
          tau_c: 0.15
          epsilon: 1.0e-8
      loss:
        pde:
          coordinate: "log_moneyness"

  - key: "abl09_residual_adaptive_sampling"
    label: "Residual-adaptive sampling"
    enabled: false
    workflow: "adaptive_collocation"
    base_variant: "abl00_baseline"
    description: "Construye collocation adaptativo desde la PINN baseline usando residual y regiones dificiles."
    adaptive_overrides:
      adaptive:
        selection:
          adaptive_ratio: 0.40
          min_source_shares:
            hard: 0.25
            short: 0.15
            atm: 0.15

  - key: "abl10_curvature_bulk_optional"
    label: "Curvature bulk"
    enabled: false
    description: "Regularizacion opcional de curvatura de tercer orden solo fuera del kink."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "kink_adapted"
        moneyness_floor: 1.0e-6
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"
        kink_bulk:
          enabled: true
          c: 2.0
          tau_c: 0.15
          delta_x: 0.05
          delta_tau: 0.02
          ell_epsilon: 1.0e-8
        weights:
          curvature_bulk: 1.0e-4

suite_id: "pinn_greek_ablation_suite_v01"
seed: 42
baseline_key: "abl00_baseline"
resolved_config_root: "outputs/pinn/ablation_suites/pinn_greek_ablation_suite_v01/resolved_configs"

base_configs:
  pipeline: "configs/pinn_pipeline_fixed_theta.yaml"
  architecture: "configs/pinn_model_architecture.yaml"
  training: "configs/pinn_training_fixed_theta.yaml"
  diagnostics: "configs/pinn_baseline_diagnostics.yaml"
  adaptive: "configs/pinn_adaptive_collocation.yaml"

diagnostics:
  output_subdir: "baseline_diagnostics"
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05

comparison:
  output_dir: "outputs/pinn/ablation_suites/pinn_greek_ablation_suite_v01"
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
  thresholds:
    global_improvement:
      global_score_max: 0.95
      price_score_max: 1.10
      hard_score_max: 1.25
      greek_ratio_max: 1.20
    hard_specialist:
      hard_score_max: 0.90
      price_score_max: 1.10
      global_score_max: 1.10
    pricing_specialist:
      full_price_ratio_max: 0.95
      hard_price_ratio_max: 1.10
      hard_price_specialist_ratio_max: 0.90
      full_price_guard_ratio_max: 1.10
      neutral_full_price_ratio_max: 1.10
      neutral_hard_price_ratio_max: 1.25

modes:
  smoke:
    training_overrides:
      sampling:
        sizes:
          n_interior: 512
          n_terminal: 128
          n_lower: 128
          n_right: 128
          n_v_zero: 128
        dynamic_collocation:
          start_epoch: 1
          refresh_every: 1
          stop_epoch: 1
          max_refreshes: 1
          n_interior: 512
          n_candidates: 512
          candidate_pool:
            n_candidates: 512
            batch_size: 128
      loop:
        epochs: 2
        mix_half_switch_epoch: 999999
        batch_size_collocation: 128
        batch_size_boundary: 64
        log_every: 1
      optimizers:
        - name: "adam"
          learn_rate: 1.0e-3
          weight_decay: 0.0
        - name: "L-BFGS"
          learn_rate: 1.0
          max_iter: 2
          line_search_fn: "strong_wolfe"
          historic_size: 20
          full_batch: true
    diagnostics_overrides:
      diagnostics:
        n_bins: 31
        surface_grid:
          x_points: 31
          y_points: 31
        finite_difference:
          enabled: false
        cf_integration:
          n_u: 240
    adaptive_overrides:
      adaptive:
        sizes:
          n_interior: 512
        candidate_pool:
          n_candidates: 2000
          batch_size: 512
      training:
        training_config: "configs/pinn_training_fixed_theta.yaml"
  full:
    diagnostics_overrides:
      diagnostics:
        n_bins: 181
        surface_grid:
          x_points: 181
          y_points: 181

variants:
  - key: "abl00_baseline"
    label: "Baseline"
    role: "baseline"
    enabled: true
    description: "PINN actual reentrenada con protocolo comun."

  - key: "abl16_baseline_log_learned_weights"
    label: "Baseline log-learned loss weights"
    enabled: true
    metric_focus: "pricing"
    description: "PINN baseline sin ACV ni log-moneyness, con pesos log-var aprendibles y regularizados sobre los terminos activos de la loss."
    training_overrides:
      loss:
        weights:
          pde: 1.0
          term: 1.0
          low: 1.0
          no_arbitrage: 1.0
        learned_weights:
          enabled: true
          terms: ["pde", "term", "low", "no_arbitrage"]
          init:
            pde: 0.0
            term: 0.0
            low: 0.0
            no_arbitrage: 0.0
          min_log_var: -3.0
          max_log_var: 3.0
          prior:
            strength: 0.2
            target: 0.0

  - key: "abl01_log_core_pdf"
    label: "Log core PDF"
    enabled: true
    description: "Ablacion individual fiel al PDF: coordenada x=log(m), PDE en x, features sqrt(tau) y q_clip, y Greeks con chain rule."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 5.0
          low: 1.0
          no_arbitrage: 0.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl11_log_core_dynamic_collocation"
    label: "Log core + dynamic collocation"
    enabled: true
    description: "Nucleo log/features del PDF con dynamic residual-adaptive collocation para escanear mejor el kink durante Adam."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
        dynamic_collocation:
          enabled: true
          start_epoch: 250
          refresh_every: 250
          stop_epoch: 2000
          max_refreshes: 8
          n_interior: 40000
          fractions:
            global: 0.40
            kink: 0.35
            adaptive: 0.25
          hard_region:
            epsilon_m: 0.03
            epsilon_tau: 0.05
          kink_band:
            c: 2.0
            tau_c: 0.15
            epsilon: 1.0e-8
          candidate_pool:
            n_candidates: 80000
            batch_size: 4096
            region_shares:
              global: 0.35
              hard: 0.25
              short: 0.15
              atm: 0.10
              kink: 0.15
          score:
            residual_weight: 1.0
            curvature_weight: 0.05
          selection:
            method: "weighted_without_replacement"
            power: 1.0
            floor: 0.05
            min_source_shares:
              hard: 0.20
              kink: 0.20
              atm: 0.10
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 5.0
          low: 1.0
          no_arbitrage: 0.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl12_log_core_bounded_price"
    label: "Log core bounded price"
    enabled: false
    metric_focus: "pricing"
    description: "Desactivada: la salida acotada elimina violaciones de positividad, pero degrada demasiado el pricing global."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
      bounded_price:
        enabled: true
        option_type: "put"
        strike: 1.0
        tau_index: 0
        spot_index: 1
        r_index: 7
        sigmoid_temperature: 2.0
        payoff_smoothing: 1.0e-4
        lower_smoothing: 1.0e-4
        min_width: 1.0e-10
        time_gate: "rational_tau"
        time_gate_tau: 2.0e-2
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 5.0
          low: 1.0
          no_arbitrage: 0.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl13_log_core_acv_pricing"
    label: "Log core ACV pricing"
    enabled: true
    metric_focus: "pricing"
    description: "PINN solo pricing con control variate Black-Scholes local y residual Heston en coordenada log."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      output:
        dim: 4
        names: ["residual_price", "residual_x", "residual_xx", "residual_v"]
        activation: "linear"
      global_acv:
        enabled: true
        option_type: "put"
        strike: 1.0
        q_epsilon: 1.0e-8
        bs_epsilon: 1.0e-12
        terminal_tau: 0.0
        z_clip: 50.0
        time_factor: "linear_tau"
        time_lambda: 1.0
        final_init_scale: 0.0
        fourier:
          frequencies: 6
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 0.1
          low: 1.0
          no_arbitrage: 0.0
          greek_delta: 0.0
          greek_gamma: 0.0
          greek_vega: 0.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl14_acv_log_learned_weights"
    label: "ACV log-learned loss weights"
    enabled: true
    metric_focus: "pricing"
    description: "PINN ACV de pricing con pesos log-var aprendibles para balancear PDE y borde inferior."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      output:
        dim: 4
        names: ["residual_price", "residual_x", "residual_xx", "residual_v"]
        activation: "linear"
      global_acv:
        enabled: true
        option_type: "put"
        strike: 1.0
        q_epsilon: 1.0e-8
        bs_epsilon: 1.0e-12
        terminal_tau: 0.0
        z_clip: 50.0
        time_factor: "linear_tau"
        time_lambda: 1.0
        final_init_scale: 0.0
        fourier:
          frequencies: 6
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 0.1
          low: 1.0
          no_arbitrage: 0.0
          greek_delta: 0.0
          greek_gamma: 0.0
          greek_vega: 0.0
        learned_weights:
          enabled: true
          terms: ["pde", "low"]
          init:
            pde: 0.0
            low: 0.0
          min_log_var: -6.0
          max_log_var: 6.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl15_acv_log_learned_weights_prior"
    label: "ACV regularized log-learned weights"
    enabled: true
    metric_focus: "pricing"
    description: "PINN ACV de pricing con pesos log-var aprendibles, clamp mas estrecho y prior cuadratico para evitar saturacion."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      output:
        dim: 4
        names: ["residual_price", "residual_x", "residual_xx", "residual_v"]
        activation: "linear"
      global_acv:
        enabled: true
        option_type: "put"
        strike: 1.0
        q_epsilon: 1.0e-8
        bs_epsilon: 1.0e-12
        terminal_tau: 0.0
        z_clip: 50.0
        time_factor: "linear_tau"
        time_lambda: 1.0
        final_init_scale: 0.0
        fourier:
          frequencies: 6
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 0.1
          low: 1.0
          no_arbitrage: 0.0
          greek_delta: 0.0
          greek_gamma: 0.0
          greek_vega: 0.0
        learned_weights:
          enabled: true
          terms: ["pde", "low"]
          init:
            pde: 0.0
            low: 0.0
          min_log_var: -3.0
          max_log_var: 3.0
          prior:
            strength: 0.2
            target: 0.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl01_log_moneyness_input"
    label: "Log-moneyness input"
    enabled: false
    description: "Desactivada: ablacion legacy incompleta; no representa la propuesta del PDF."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0

  - key: "abl02_log_pde_residual"
    label: "Log PDE residual"
    enabled: false
    description: "Desactivada: requiere dataset en x=log(m) y chain rule coherente; cubierta por abl01_log_core_pdf."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "log_moneyness"
        moneyness_floor: 1.0e-6
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"

  - key: "abl03_log_greek_chain_rule"
    label: "Log Greek chain rule"
    enabled: false
    description: "Desactivada: separaba artificialmente la chain rule de la PDE y las features."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "log_moneyness"
        moneyness_floor: 1.0e-6
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"
    diagnostics_overrides:
      global:
        spot_feature: "moneyness"

  - key: "abl04_kink_adapted_features"
    label: "Kink-adapted features"
    enabled: false
    description: "Desactivada temporalmente: las features adaptadas ya se estudian junto al nucleo log-PDF en abl01_log_core_pdf."
    architecture_overrides:
      feature_map:
        enabled: true
        mode: "kink_adapted"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      loss:
        pde:
          coordinate: "log_moneyness"

  - key: "abl05_guard_boundaries"
    label: "PDF guards"
    enabled: true
    description: "Nucleo log del PDF mas borde izquierdo deep ITM, borde derecho far-field OTM y residual degenerado en v=0."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        sizes:
          n_right: 10000
          n_v_zero: 10000
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
          right_moneyness: 3.0
          v_zero_value: 0.0
      loss:
        pde:
          coordinate: "log_moneyness"
        weights:
          pde: 1.0
          term: 5.0
          low: 1.0
          left_delta: 0.25
          left_gamma: 0.05
          right: 1.0
          right_delta: 0.25
          right_gamma: 0.05
          v_zero: 0.5
          no_arbitrage: 0.0
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl06_no_arbitrage"
    label: "PDF no-arbitrage"
    enabled: true
    description: "Nucleo log y guards del PDF mas penalizaciones reales de bounds de precio, rango de Delta y convexidad."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        sizes:
          n_right: 10000
          n_v_zero: 10000
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
          right_moneyness: 3.0
          v_zero_value: 0.0
      loss:
        pde:
          coordinate: "log_moneyness"
        no_arbitrage:
          beta_delta: 1.0
          beta_gamma: 1.0
        weights:
          pde: 1.0
          term: 5.0
          low: 1.0
          left_delta: 0.25
          left_gamma: 0.05
          right: 1.0
          right_delta: 0.25
          right_gamma: 0.05
          v_zero: 0.5
          no_arbitrage: 0.05
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl07_kink_bulk_loss"
    label: "PDF kink/bulk loss"
    enabled: true
    description: "Nucleo log, guards y no-arbitrage mas separacion L_PDE,kink / L_PDE,bulk con gate suave."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        sizes:
          n_right: 10000
          n_v_zero: 10000
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
          right_moneyness: 3.0
          v_zero_value: 0.0
      loss:
        pde:
          coordinate: "log_moneyness"
        no_arbitrage:
          beta_delta: 1.0
          beta_gamma: 1.0
        kink_bulk:
          enabled: true
          c: 2.0
          tau_c: 0.15
          delta_x: 0.05
          delta_tau: 0.02
          ell_epsilon: 1.0e-8
        weights:
          pde: 1.0
          pde_bulk: 1.0
          pde_kink: 3.0
          term: 5.0
          low: 1.0
          left_delta: 0.25
          left_gamma: 0.05
          right: 1.0
          right_delta: 0.25
          right_gamma: 0.05
          v_zero: 0.5
          no_arbitrage: 0.05
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl08_kink_band_sampling"
    label: "PDF kink-band sampling"
    enabled: true
    description: "Ablacion incremental que anade muestreo focalizado en |x| <= c sqrt(v tau + eps), tau <= tau_c."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        sizes:
          n_right: 10000
          n_v_zero: 10000
        domain:
          moneyness: [0.05, 2.0]
        boundaries:
          lower_moneyness: 0.05
          right_moneyness: 3.0
          v_zero_value: 0.0
        kink_band:
          enabled: true
          fraction: 0.30
          c: 2.0
          tau_c: 0.15
          epsilon: 1.0e-8
      loss:
        pde:
          coordinate: "log_moneyness"
        no_arbitrage:
          beta_delta: 1.0
          beta_gamma: 1.0
        kink_bulk:
          enabled: true
          c: 2.0
          tau_c: 0.15
          delta_x: 0.05
          delta_tau: 0.02
          ell_epsilon: 1.0e-8
        weights:
          pde: 1.0
          pde_bulk: 1.0
          pde_kink: 3.0
          term: 5.0
          low: 1.0
          left_delta: 0.25
          left_gamma: 0.05
          right: 1.0
          right_delta: 0.25
          right_gamma: 0.05
          v_zero: 0.5
          no_arbitrage: 0.05
    diagnostics_overrides:
      global:
        spot_feature: "log_moneyness"
      diagnostics:
        surface_grid:
          x_feature: "moneyness"
        boundary_checks:
          lower_moneyness: 0.05

  - key: "abl09_residual_adaptive_sampling"
    label: "PDF residual-adaptive sampling"
    enabled: true
    workflow: "adaptive_collocation"
    base_variant: "abl08_kink_band_sampling"
    description: "Fine-tuning adaptativo desde abl08 con mezcla 50% global, 30% kink-band y 20% adaptive por |R| + c|G|."
    architecture_overrides:
      input:
        features: ["tau", "log_moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "log_moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
    training_overrides:
      sampling:
        coordinate_space: "log_moneyness"
        sizes:
          n_right: 10000
          n_v_zero: 10000
        domain:
          moneyness: [0.05, 2.0]

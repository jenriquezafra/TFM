meta:
  seed: 42
  device: "auto" # auto | cpu | mps | cuda
  optimizer: "mix_half" # adam | sgd | L-BFGS | mix_half

data:
  supervised_source: "cann_quotes_comparison"
  target_column: "price_market"
  val_fraction: 0.2
  input_scaling:
    enabled: true
    method: "standardize_train"
    eps: 1.0e-8

sampling:
  strategy: "lhs_static"
  mode: "parametric_theta"
  seed: 42
  output_dir: "data/synth/PINN_param_2x_v01"
  sizes:
    n_interior: 40000
    n_terminal: 10000
    n_lower: 10000
  domain:
    tau: [0.0, 3.0]
    moneyness: [0.0, 2.0]
    v: [0.01, 0.5]
    r: [0.0, 0.05]
    heston_params:
      rho: [-0.9, 0.0]
      kappa: [0.0, 3.0]
      gamma: [0.01, 0.8]
      bar_v: [0.01, 0.5]

optimizers:
  - name: "adam"
    learn_rate: 1.0e-3
    weight_decay: 0.0
  - name: "L-BFGS"
    learn_rate: 1.0
    max_iter: 30
    line_search_fn: "strong_wolfe"
    historic_size: 100
    full_batch: true

loss:
  reduction: "mean"
  weights:
    pde: 1.0
    term: 1.0
    low: 1.0
    no_arbitrage: 1.0

loop:
  epochs: 4000
  mix_half_switch_epoch: 2001
  batch_size_collocation: 2048
  batch_size_boundary: 512
  log_every: 50

callbacks:
  checkpoint:
    enabled: true
    filename_best: "model_best.pt"
    filename_last: "model_last.pt"
  early_stopping:
    enabled: false
    monitor: "val_total_loss"
    patience: 300
    min_delta: 1.0e-7
  lr_scheduler:
    enabled: true
    name: "step"
    step_size: 500
    gamma: 0.5

evaluation:
  enabled: true
  batch_size: 8192
  metrics: ["mse", "mae", "rmse", "pde_residual_l2"]

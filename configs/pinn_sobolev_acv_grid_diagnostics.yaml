global:
  experiment_id: "sobolev_pinn_acv_grid"
  run_dir: "PINN_mix_scaled_param"
  checkpoint_name: "outputs/protos/sobolev_mix/PINN_mix_scaled_param_v01/checkpoints/model_best.pt"
  architecture_config: null
  device: "auto"
  dtype: "float64"
  feature_order: null

  spot_feature: "moneyness"
  vol_feature: "v"
  tau_feature: "tau"
  rate_feature: "r"
  theta_sign: "minus_dv_dtau"
  strike: 1.0

  chunk_size_values: 4096
  chunk_size_jac: 512
  chunk_size_hess: 64

diagnostics:
  output_subdir: "sobolev_acv_grid_diagnostics"
  option_type: "put"
  mape_floor: 1.0e-4
  stabilized_relative_floor: 1.0
  n_bins: 181

  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05

  surface_grid:
    x_feature: "moneyness"
    x_min: 0.8
    x_max: 1.2
    x_points: 181
    y_feature: "tau"
    y_min: 0.005
    y_max: 2.0
    y_points: 181

  fixed_values:
    tau: 1.0
    moneyness: 1.0
    v: 0.04
    rho: -0.7
    kappa: 2.0
    gamma: 0.3
    bar_v: 0.04
    r: 0.01

  finite_difference:
    enabled: false

  derivative_residual:
    enabled: false

  boundary_checks:
    enabled: false

  cf_integration:
    u_min: 1.0e-6
    u_max: 200.0
    n_u: 1200

meta:
  seed: 42
  device: "auto"
  optimizer: "adam"
  initial_checkpoint: "outputs/pinn/PINN_mix_scaled_param/train/checkpoints/model_best.pt"
  initial_checkpoint_strict: false

data:
  supervised_source: "cann_quotes_comparison"
  target_column: "price_market"
  val_fraction: 0.2
  input_scaling:
    enabled: true
    method: "from_train_summary"
    summary_file: "outputs/pinn/PINN_mix_scaled_param/train/metrics/train_summary.yaml"

sampling:
  strategy: "lhs_static"
  mode: "parametric_theta"
  seed: 42
  output_dir: "data/synth/PINN_param_2x_v01"
  sizes:
    n_interior: 40000
    n_terminal: 10000
    n_lower: 10000
  domain:
    tau: [0.0, 3.0]
    moneyness: [0.0, 2.0]
    v: [0.01, 0.5]
    r: [0.0, 0.05]
    heston_params:
      rho: [-0.9, 0.0]
      kappa: [0.0, 3.0]
      gamma: [0.01, 0.8]
      bar_v: [0.01, 0.5]

optimizers:
  - name: "adam"
    learn_rate: 5.0e-5
    weight_decay: 0.0
  - name: "L-BFGS"
    learn_rate: 0.5
    max_iter: 20
    line_search_fn: "strong_wolfe"
    historic_size: 100
    full_batch: false
    batch_size: 2048

loss:
  reduction: "mean"
  weights:
    pde: 1.0
    term: 1.0
    low: 1.0
    no_arbitrage: 1.0
    greek_delta: 1.0e-1
    greek_gamma: 1.0e-2
    greek_vega: 1.0e-1

loop:
  epochs: 1000
  mix_half_switch_epoch: null
  batch_size_collocation: 512
  batch_size_boundary: 512
  log_every: 25

callbacks:
  checkpoint:
    enabled: true
    filename_best: "model_best.pt"
    filename_last: "model_last.pt"
  early_stopping:
    enabled: false
    monitor: "val_total_loss"
    patience: 150
    min_delta: 1.0e-7
  lr_scheduler:
    enabled: true
    name: "step"
    step_size: 250
    gamma: 0.5

evaluation:
  enabled: true
  batch_size: 4096
  metrics: ["mse", "mae", "rmse", "pde_residual_l2"]

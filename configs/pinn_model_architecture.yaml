name: "PINN_Heston_Price"
type: "mlp_pinn"

input:
  # Expected structure: [tau, moneyness, v, rho, kappa, gamma, bar_v, r]
  dim: 8
  features: ["tau", "moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]

hidden:
  dims: [256, 256, 256, 256]
  activation: "tanh"
  initialization: "xavier_uniform"
  dropout_rate: 0.0
  batch_norm: false

output:
  dim: 1
  name: "price"
  activation: "linear"

physics:
  equation: "heston_pde"
  requires_autograd: true
  derivative_order: 2

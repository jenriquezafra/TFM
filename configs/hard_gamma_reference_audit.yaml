meta:
  experiment_id: "hard_gamma_reference_audit"
  seed: 42

sampling:
  n_points: 128
  tau_min: 1.0e-4
  hard_region:
    x_abs: 0.03
    tau_max: 0.05
  domain:
    v: [0.01, 0.5]
    r: [0.0, 0.05]
    heston_params:
      rho: [-0.9, 0.0]
      kappa: [0.0, 3.0]
      gamma: [0.01, 0.8]
      bar_v: [0.01, 0.5]

finite_difference:
  h_x_values: [5.0e-4, 1.0e-3, 2.0e-3, 5.0e-3]

cf_integration:
  u_min: 1.0e-6
  u_max: 200.0
  n_u: 1200

outputs:
  output_dir: "outputs/pinn/acv_hard_patch_experimental/reference_audit"

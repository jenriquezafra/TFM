meta:
  experiment_name: "PINN_fixed_theta_tanh_cann_1M_v01"
  seed: 42
  description: "PINN fixed-theta using theta_star from Liu_like_tanh_1M_v01 Calibration_2."

inputs:
  cann:
    calibration_dir: "outputs/calibration/Liu_like_tanh_1M_v01/Calibration_2"
    summary_file: "summary.yaml"
    quotes_file: "quotes_comparison.parquet"
    parameter_key: "theta_star"
    columns:
      moneyness: "moneyness"
      tau: "tau"
      r: "r"
      iv_market: "iv_market"
      iv_pred: "iv_pred"

  pricing_context:
    target_name: "price_market"
    spot: null
    strike_column: null

model:
  architecture_config: "configs/pinn_model_architecture.yaml"

training:
  training_config: "configs/pinn_training_fixed_theta_tanh_cann_1m.yaml"

pipeline:
  stages:
    prepare_dataset: true
    train: true
    evaluate: true

outputs:
  root_dir: "outputs/pinn"
  run_name: "PINN_fixed_theta_tanh_cann_1M_v01"
  dump_plan_filename: "pipeline_plan.yaml"

# Defines the orchestration of the training process:
#   - runtime hyperparameters (epochs, batch size, seed)
#   - callbacks (early stopping, LR scheduler, checkpoints)
#   - dataset selection and I/O paths
#   - reference to the neural network configuration


name: "nn_heston_training"

optimizer:
  name: "adam"
  learning_rate: 1.0e-3

loss:
  name: "mse"

metrics: 
  - "mae"

fit:
  epochs: 100 # cambiar
  batch_size: 64 # cambiar
  shuffle: false # cambiar

callbacks:
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 20
    restore_best_weights: true

  checkpoints:
    enabled: true
    monitor: "val_loss"
    save_best_only: true

output_path: "artifacts/models/pricer_nn/baseline" # cambiar lo de baseline si aplica
global:
  run_dir: "latest"
  checkpoint_name: "model_best.pt"
  architecture_config: null
  device: "auto"
  dtype: "float64"
  feature_order: null

  spot_feature: "moneyness"
  vol_feature: "v"
  tau_feature: "tau"
  rate_feature: "r"
  theta_sign: "minus_dv_dtau"
  strike: 1.0

  chunk_size_values: 4096
  chunk_size_jac: 512
  chunk_size_hess: 64

benchmark:
  source_mode: "surface_grid"   # collocation | fixed_point | surface_grid
  collocation_manifest: null
  collocation_dataset: "interior"   # interior | terminal | lower
  input_csv: null
  n_points: 1200
  seed: 42

  option_type: "put"           # call | put
  mape_floor: 1.0e-4
  n_bins: 161
  output_subdir: "benchmark_cf"

  # Used when source_mode=surface_grid
  surface_grid:
    x_feature: "moneyness"
    x_min: 0.8
    x_max: 1.2
    x_points: 161
    y_feature: "tau"
    y_min: 0.05
    y_max: 2.0
    y_points: 161

  # Used only when source_mode=fixed_point and as base defaults for surface grids.
  # Fixed to theta_star from:
  # outputs/calibration/Liu_like_v01/Calibration_no_reg/summary.yaml
  fixed_values:
    tau: 1.0
    moneyness: 1.0
    v: 0.21971117661996578
    rho: -0.5241299828927267
    kappa: 1.0576232226342916
    gamma: 0.29956827744543396
    bar_v: 0.19758448825937408
    r: 0.01

  # Heston characteristic-function integration settings
  cf_integration:
    u_min: 1.0e-6
    u_max: 200.0
    n_u: 1200

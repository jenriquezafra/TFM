meta:
  experiment_id: "PINN_Sobolev_ACV_final"
  seed: 42
  device: "auto"
  dtype: "float64"
  description: >
    ACV-HardPatch diagnostic using the final fixed-theta Sobolev PINN checkpoint
    as the frozen baseline. It keeps the best reliable-floor gate from the ACV
    control-variate experiment and leaves the residual network initialized at
    zero, so the run isolates the analytical control variate applied on top of
    the final Sobolev model.

baseline:
  run_dir: "PINN_mix_scaled_fixed_theta"
  checkpoint_name: "outputs/protos/sobolev_mix_fixed_theta/PINN_mix_scaled_fixed_theta_20260420_225517/checkpoints/model_last.pt"
  architecture_config: null
  feature_order: null

model:
  residual:
    hidden_dims: [128, 128, 128, 128]
    activation: "tanh"
    fourier_frequencies: 6
    final_init_scale: 0.0

patch:
  gate:
    x_center: 0.08
    tau_center: 0.10
    delta_x: 0.01
    delta_tau: 0.015
  scales:
    q_epsilon: 1.0e-10
    bs_epsilon: 1.0e-12
    tau_epsilon: 1.0e-8
    terminal_tau: 0.0
    z_clip: 50.0

sampling:
  tau_min: 1.0e-4
  domain:
    tau: [0.0, 3.0]
    moneyness: [0.01, 2.0]
    v: [0.01, 0.5]
    r: [0.0, 0.05]
    heston_params:
      rho: [-0.9, 0.0]
      kappa: [0.0, 3.0]
      gamma: [0.01, 0.8]
      bar_v: [0.01, 0.5]
  hard_region:
    x_abs: 0.03
    tau_max: 0.05
  patch_region:
    x_abs: 0.06
    tau_max: 0.08
    buffer_x_abs: 0.08
    buffer_tau_max: 0.10
  z_sampling:
    z_min: -4.0
    z_max: 4.0
  pde_mix:
    hard_core: 0.35
    z_layer: 0.20
    buffer: 0.30
    global: 0.15

price_labels:
  enabled: false

stencil_labels:
  enabled: false

training:
  save_initial_checkpoint_only: true
  stages: []

outputs:
  root_dir: "outputs/pinn"
  run_name: "PINN_Sobolev_ACV_final"


meta:
  name: heston_synth_data
  seed: 42

data:
    n_samples: 10000000 # target total samples in the master dataset
    batch_size: 1024 
    splits:
      train: 0.8
      val: 0.1
      test: 0.1
      stratify:
        enabled: false
        target_column: "iv_brent"
        n_bins: 20
    heston_params:    # taken from Liu
      rho: [-0.9, 0.0]  
      kappa: [0.0, 3.0]        #[0.0, 3.0] # 0.9
      gamma: [0.01, 0.8]
      bar_v: [0.01, 0.5]
      v0: [0.05, 0.5]          #[0.05, 0.5] # 0.36
      sampling:
        n_params_samples: 5 # like Liu aswell
        method: "lhs"
    grid:
    # taken from Liu
      moneyness: [0.6, 1.4] 
      tau: [0.05, 3.0]
      sampling:
        n_params_samples: 100 
        method: "lhs"

market:
  r: [0.0, 0.05]
  K: 1                # fixed as Liu
  option_type: "put"  # better for COS 
  sampling:
    n_params_samples: 100 
    method: "lhs"

cos_solver:       # NOT from Liu
  N: 1500     # Liu uses 1500
  L: 50       # Liu uses 50
  interval_rule: "cumulant_autodiff"  # options: "sqrt_t" (legacy), "cumulant_autodiff"

root_finder:
  method: "brent_iv" 
  methods:
    brent_iv: # NOT from Liu
      tol: 1.0e-8
      max_iter: 100
      iv_bounds: [1.0e-6, 5.0]
    LM:
      sigma0: 0.2

quality_check:
  residual_warn_abs: 1.0e-6
  residual_keep_abs: null
  drop_sigma0_hits: false
  keep_all_rows: true
  adaptive_cos_floor_retry:
    enabled: true
    floor_rel_tol: 1.0e-6
    l_multiplier: 1.5
    n_multiplier: 1.0
    max_retries: 1
  force_target_after_filters: true
  generation_chunk_size: 250000
  max_generation_rounds: 60
  feller_filter:
    enabled: false
    slack_tol: 0.0
  progress_every: 1000

output:
  dtype: "float32"

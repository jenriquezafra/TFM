meta:
  seed: 42
  description: "Sensitivity analysis configuration"


model_dir: "ADAM_v02" # can change to the name of the dir

parameters:
  pairs: 
    - ["gamma", "bar_v"]
    - ["rho", "gamma"]
    - ["kappa", "bar_v"]

  fixed_values:
    rho:  -0.45
    kappa: 1.5
    gamma: 0.4
    bar_v: 0.25
    v0: 0.3
    moneyness: 1.0
    tau: 1.0
    r: 0.025

grid:
  n_points: 100
  expansion_factor: 1.2 # fallback only for params not present in extrapolation_ranges
  extrapolation_ranges:
    rho: [-1.1, 0.0]
    kappa: [0.0, 3.5]
    gamma: [0.0, 1.0]
    bar_v: [0.0, 0.6]
    v0: [0.0, 0.75]
    moneyness: [0.7, 1.3]
    tau: [0.2, 2.0]
    r: [0.00, 0.06]

error_metric: "abs_diff" # options: abs_diff, rmse, mse, difference

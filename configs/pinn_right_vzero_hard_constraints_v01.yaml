suite_id: "pinn_right_vzero_hard_constraints_v01"
seed: 42
baseline_key: "rv01_hard_right_vzero_dynamic"
resolved_config_root: "outputs/pinn/ablation_suites/pinn_right_vzero_hard_constraints_v01/resolved_configs"

base_configs:
  pipeline: "configs/pinn_pipeline_fixed_theta.yaml"
  architecture: "configs/pinn_model_architecture.yaml"
  training: "configs/pinn_training_fixed_theta.yaml"
  diagnostics: "configs/pinn_baseline_diagnostics.yaml"
  adaptive: "configs/pinn_adaptive_collocation.yaml"

diagnostics:
  output_subdir: "pricing_diagnostics"
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05

comparison:
  output_dir: "outputs/pinn/ablation_suites/pinn_right_vzero_hard_constraints_v01"
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05

modes:
  smoke:
    training_overrides:
      sampling:
        sizes:
          n_interior: 512
          n_terminal: 128
          n_lower: 128
          n_right: 128
          n_v_zero: 128
        dynamic_collocation:
          start_epoch: 2
          refresh_every: 1
          stop_epoch: 2
          max_refreshes: 1
          n_interior: 512
          candidate_pool:
            n_candidates: 768
            batch_size: 256
      loop:
        epochs: 3
        mix_half_switch_epoch: 999999
        batch_size_collocation: 128
        batch_size_boundary: 64
        val_every: 1
        log_every: 1
      optimizers:
        - name: "adam"
          learn_rate: 1.0e-3
          weight_decay: 0.0
        - name: "L-BFGS"
          learn_rate: 1.0
          max_iter: 2
          line_search_fn: "strong_wolfe"
          historic_size: 20
          full_batch: true
    diagnostics_overrides:
      diagnostics:
        n_bins: 31
        surface_grid:
          x_points: 31
          y_points: 31
        finite_difference:
          enabled: false
        cf_integration:
          n_u: 240

  full:
    training_overrides:
      meta:
        optimizer: "adam"
      sampling:
        sizes:
          n_interior: 24000
          n_terminal: 5000
          n_lower: 5000
          n_right: 1024
          n_v_zero: 10000
      optimizers:
        - name: "adam"
          learn_rate: 1.0e-3
          weight_decay: 0.0
        - name: "L-BFGS"
          learn_rate: 1.0
          max_iter: 30
          line_search_fn: "strong_wolfe"
          historic_size: 100
          full_batch: true
      loop:
        epochs: 1600
        mix_half_switch_epoch: 999999
        batch_size_collocation: 2048
        batch_size_boundary: 512
        val_every: 25
        log_every: 100
      callbacks:
        lr_scheduler:
          enabled: true
          name: "step"
          step_size: 400
          gamma: 0.7
    diagnostics_overrides:
      diagnostics:
        n_bins: 181
        surface_grid:
          x_points: 181
          y_points: 181

variants:
  - key: "rv01_hard_right_vzero_dynamic"
    label: "Hard bounds/right + v=0 + dynamic residual"
    role: "baseline"
    metric_focus: "pricing"
    enabled: true
    description: "Right-vzero no supervisada con payoff/lower/right/no-arbitraje impuestos por construccion y refresco adaptativo por residual."
    architecture_overrides:
      type: "mlp_pinn_bounded_price"
      input:
        features: ["tau", "moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]
      feature_map:
        enabled: true
        mode: "kink_adapted"
        input_coordinate: "moneyness"
        moneyness_floor: 1.0e-6
        tau_epsilon: 1.0e-6
        q_epsilon: 1.0e-8
        q_clip: 10.0
      bounded_price:
        enabled: true
        option_type: "put"
        strike: 1.0
        sigmoid_temperature: 2.0
        payoff_smoothing: 0.0
        lower_smoothing: 0.0
        min_width: 1.0e-12
        time_gate: "rational_tau"
        time_gate_tau: 2.0e-2
        right_boundary:
          enabled: true
          moneyness: 3.0
          start_moneyness: 2.0
          power: 2.0
          mode: "smoothstep"
    training_overrides:
      sampling:
        boundaries:
          lower_moneyness: 0.0
          right_moneyness: 3.0
          v_zero_value: 0.0
        dynamic_collocation:
          enabled: true
          start_epoch: 300
          refresh_every: 300
          stop_epoch: 1200
          max_refreshes: 4
          n_interior: 24000
          fractions:
            global: 0.35
            kink: 0.35
            adaptive: 0.30
          hard_region:
            epsilon_m: 0.03
            epsilon_tau: 0.05
          kink_band:
            c: 2.0
            tau_c: 0.20
            epsilon: 1.0e-8
          candidate_pool:
            n_candidates: 50000
            batch_size: 2048
            region_shares:
              global: 0.25
              hard: 0.25
              short: 0.15
              atm: 0.15
              kink: 0.20
          score:
            residual_weight: 1.0
            curvature_weight: 0.01
          selection:
            method: "rar-d"
            power: 1.0
            floor: 0.05
            min_source_shares:
              hard: 0.20
              kink: 0.20
              atm: 0.10
      loss:
        pde:
          coordinate: "moneyness"
        weights:
          pde: 1.0
          term: 0.0
          low: 0.0
          right: 0.0
          v_zero: 0.5
          no_arbitrage: 0.0


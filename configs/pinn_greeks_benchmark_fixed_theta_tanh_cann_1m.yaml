global:
  run_dir: "PINN_fixed_theta_tanh_cann_1M_v01"
  checkpoint_name: "model_best.pt"
  architecture_config: null
  device: "auto"
  dtype: "float64"
  feature_order: null

  spot_feature: "moneyness"
  vol_feature: "v"
  tau_feature: "tau"
  rate_feature: "r"
  theta_sign: "minus_dv_dtau"
  strike: 1.0

  chunk_size_values: 4096
  chunk_size_jac: 512
  chunk_size_hess: 64

benchmark:
  source_mode: "surface_grid" # collocation | fixed_point | surface_grid
  collocation_manifest: null
  collocation_dataset: "interior" # interior | terminal | lower
  input_csv: null
  n_points: 1200
  seed: 42

  option_type: "put"
  mape_floor: 1.0e-4
  n_bins: 161
  output_subdir: "benchmark_cf_tanh_cann_1m"

  surface_grid:
    x_feature: "moneyness"
    x_min: 0.8
    x_max: 1.2
    x_points: 161
    y_feature: "tau"
    y_min: 0.05
    y_max: 2.0
    y_points: 161

  # theta_star from outputs/calibration/Liu_like_tanh_1M_v01/Calibration_2/summary.yaml
  fixed_values:
    tau: 1.0
    moneyness: 1.0
    v: 0.21981678356626227
    rho: -0.4580521656046723
    kappa: 1.0008479100720014
    gamma: 0.34342840240528694
    bar_v: 0.19989821428766616
    r: 0.01

  cf_integration:
    u_min: 1.0e-6
    u_max: 200.0
    n_u: 1200

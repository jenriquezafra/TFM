meta:
  experiment_id: "adaptive_collocation"
  seed: 42
  description: "Residual-based adaptive collocation fine-tuning from the stable boundary-layer PINN."

base:
  run_dir: "outputs/pinn/boundary_layer_pinn_no_payoff"
  checkpoint: null
  train_summary: null
  collocation_manifest: null
  device: "auto"

model:
  architecture_config: "configs/pinn_model_architecture_boundary_layer_no_payoff.yaml"

training:
  training_config: "configs/pinn_training_adaptive_collocation.yaml"
  output_dir: "outputs/pinn/adaptive_collocation/train"

adaptive:
  seed: 42
  output_dir: "data/synth/PINN_param_2x_v01_adaptive_collocation"
  sizes:
    n_interior: 40000
  hard_region:
    epsilon_m: 0.03
    epsilon_tau: 0.05
  candidate_pool:
    n_candidates: 120000
    batch_size: 2048
    n_bins_tau: 36
    n_bins_m: 36
    region_shares:
      uniform: 0.50
      hard: 0.20
      short: 0.15
      atm: 0.15
  selection:
    adaptive_ratio: 0.40
    min_source_shares:
      hard: 0.25
      short: 0.15
      atm: 0.15
  sampling:
    strategy: "lhs_static"
    mode: "parametric_theta"
    seed: 42
    sizes:
      n_interior: 40000
      n_terminal: 10000
      n_lower: 10000
    domain:
      tau: [0.0, 3.0]
      moneyness: [0.0, 2.0]
      v: [0.01, 0.5]
      r: [0.0, 0.05]
      heston_params:
        rho: [-0.9, 0.0]
        kappa: [0.0, 3.0]
        gamma: [0.01, 0.8]
        bar_v: [0.01, 0.5]

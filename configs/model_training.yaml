data:
  dir: "data/synth/2026-01-06_20:07:49"
  shuffle: true
  splits:
    train: 0.8
    val: 0.1
    test: 0.1

optimizer:
  name: "adam"
  learn_rate: 1.0e-3  #NOTE: default for Adam
  weight_decay: 0.0

loss:
  name: "mse" # mse | mae | negative log-likelihood loss function (nll) | cross entropy

loop:
  epochs: 500 # TODO: update
  batch_size: 1024

callbacks:
  early_stopping:
    enabled: False
    monitor: "val_loss"
    patience: 20        # higher if we have noise
    min_delta: 0.0
    warmup_epochs: 10
    mode: "min"

  checkpoint:
    enabled: True
    filename_best: "model_best.pt"
    filename_last: "model_last.pt"


  lr_scheduler:   # StepLR to update lr as the epochs increases
    name: "step"
    step_size: 10
    gamma: 0.5

  logging:

meta:
  seed: 42
  output_dir: # TODO
  #TODO: creo que Liu tiene un callback cuando el Brent va mal o algo asi?
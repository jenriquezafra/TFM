name: "PINN_Heston_Price_PayoffAware_AdaptiveSmoothing_Experimental"
type: "mlp_pinn_payoff_aware_adaptive_smoothing_experimental"

input:
  # Expected raw financial structure:
  # [tau, moneyness, v, rho, kappa, gamma, bar_v, r]
  dim: 8
  features: ["tau", "moneyness", "v", "rho", "kappa", "gamma", "bar_v", "r"]

hidden:
  dims: [256, 256, 256, 256]
  activation: "tanh"
  initialization: "xavier_uniform"
  dropout_rate: 0.0
  batch_norm: false

output:
  dim: 1
  name: "price"
  activation: "linear"

payoff_aware:
  enabled: true
  option_type: "put"
  tau_index: 0
  spot_index: 1
  vol_index: 2
  strike: 1.0

  # EXPERIMENTAL:
  # Adaptive payoff smoothing attempts to match the short-maturity diffusion
  # scale epsilon(tau,v)=c*sqrt(v*tau+eps0). Keep this variant separate from the
  # fixed-smoothing payoff-aware baseline until diagnostics prove it helps.
  payoff_smoothing_mode: "adaptive_sqrt_v_tau"
  payoff_smoothing: 1.0e-3
  payoff_smoothing_scale: 5.0e-2
  payoff_smoothing_epsilon: 1.0e-10
  payoff_smoothing_min: 1.0e-5
  payoff_smoothing_max: 2.0e-2

  time_factor: "linear_tau"
  time_epsilon: 1.0e-6

physics:
  equation: "heston_pde"
  requires_autograd: true
  derivative_order: 2
